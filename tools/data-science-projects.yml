# which keeps this site light. Edit, then run:  python tools/build_portfolio.py
#
# Fields
#   slug      thumbnail file: images/data-science/<slug>.jpg (800x576)
#   url       the project's datascienceportfol.io page
#   group     filter on the page (see `groups`)
#   summary   one short sentence (about 120 characters)

